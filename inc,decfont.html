<!DOCTYPE html>
<html>
<head>
    <title>Font Size Change</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #f4f4f4;
    }

    h1, h2 {
        color: #333;
    }

    #time, #result {
        font-size: 24px;
        font-weight: bold;
        color: #0066cc;
    }

    p {
        font-size: 18px;
        cursor: pointer;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    img {
        margin-top: 20px;
    }
</style>
</head>
<body>
    <h1>Change Font Size!</h1>

    <p id="para1" onmouseover="incSize()" onmouseout="decSize()">
        Move cursor over me to zoom in...
    </p>

    <script>
        function incSize() {
            document.getElementById("para1").style.fontSize = "28px";
        }

        function decSize() {
            document.getElementById("para1").style.fontSize = "16px";
        }
    </script>
</body>
</html>
