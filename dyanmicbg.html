<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Background</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #f4f4f4;
    }

    h1, h2 {
        color: #333;
    }

    #time, #result {
        font-size: 24px;
        font-weight: bold;
        color: #0066cc;
    }

    p {
        font-size: 18px;
        cursor: pointer;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    img {
        margin-top: 20px;
    }
</style>
</head>
<body>
    <h1>Dynamic Background!</h1>

    <script>
        function setBackgroundColor() {
            var red = Math.floor(Math.random() * 255);
            var green = Math.floor(Math.random() * 255);
            var blue = Math.floor(Math.random() * 255);

            var color = "rgb(" + red + "," + green + "," + blue + ")";
            document.body.style.backgroundColor = color;
        }

        setInterval(setBackgroundColor, 2000);
    </script>
</body>
</html>
